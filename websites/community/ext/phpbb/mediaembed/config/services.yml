imports:
    - { resource: cron.yml }

services:
    phpbb.mediaembed.formatter_listener:
        class: phpbb\mediaembed\event\formatter_listener
        arguments:
            - '@config'
            - '@config_text'
            - '@phpbb.mediaembed.sitescollection'
            - '%core.cache_dir%'
        tags:
            - { name: event.listener }

    phpbb.mediaembed.parsing_listener:
        class: phpbb\mediaembed\event\parsing_listener
        arguments:
            - '@auth'
            - '@config'
        tags:
            - { name: event.listener }

    phpbb.mediaembed.display_listener:
        class: phpbb\mediaembed\event\display_listener
        arguments:
            - '@config'
            - '@config_text'
            - '@language'
            - '@template'
        tags:
            - { name: event.listener }

    phpbb.mediaembed.customsitescollection:
        class: phpbb\mediaembed\collection\customsitescollection
        arguments:
            - '@ext.manager'

    phpbb.mediaembed.upstreamsitescollection:
        class: phpbb\mediaembed\collection\upstreamsitescollection

    phpbb.mediaembed.sitescollection:
        class: phpbb\mediaembed\collection\sitescollection
        arguments:
            - '@config'
            - '@phpbb.mediaembed.customsitescollection'
            - '@phpbb.mediaembed.upstreamsitescollection'

    phpbb.mediaembed.cache:
        class: phpbb\mediaembed\cache\cache
        arguments:
            - '@cache.driver'
            - '%text_formatter.cache.parser.key%'
            - '%text_formatter.cache.renderer.key%'

    phpbb.mediaembed.acp_controller:
        class: phpbb\mediaembed\controller\acp_controller
        arguments:
            - '@config'
            - '@config_text'
            - '@language'
            - '@log'
            - '@phpbb.mediaembed.cache'
            - '@request'
            - '@template'
            - '@text_formatter.s9e.factory'
            - '@user'
